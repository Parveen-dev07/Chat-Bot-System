name: chat-app CI

on:
    push:
        branches:
        - main
        - Chat-system
        - test-dev

    pull_request:
        branches:
         - main
         - Chat-system
         - test-dev    



jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout respository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 22
                cache: npm

            - name: Setup npm
              run: npm install -g npm@11.6.2

            - name: Install dependencies
              run: npm ci
             
            - name: Build backend
              run: npm run build --workspace=api

            - name: Build frontend
              run: npm run build --workspace=web

            - name: Build backend Docker image
              run: docker build -f docker/api.Dockerfile -t chat-api:ci .

            - name: Build frontend Docker image
              run: docker build -f docker/web.Dockerfile -t chat-web:ci .

             

