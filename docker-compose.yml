services:
   
# api = our backend service name 
  api:


    #  build = Tells Docker compose to build an image for this service using a dockerfile.
    build:

       
      #  context = the directory whose files Docker can access during the image build 
      context: .

      #  dockerfile = specifies which dockerfile to use for building this backend images 
      dockerfile : docker/api.Dockerfile
      


      # conatiner_name = Assign a custom name to the create backend container 
    container_name: chat-api

      # port = connects a port on your computer to a port inside the container 
    ports:
      
      # format: "HOST_PORT : CONTAINER_POST"
      # first 5000 = Your computer's port.
      # second 5000 = Created backend container port.
        - "5000:5000"


      #  env_file = read environment varibles from the specified .env file and passes then to the backend container
    env_file:
        - ./apps/api/.env

      # environment = defines environment varibles directly from this container.

    environment:
          # your application can read this using process.env.DOCKER 
         - DOCKER=true
         - DOCKER_MONGODB_URI=mongodb://mongo:27017/chat-application

    depends_on:
      - mongo


  web:

    build:

      context: .

      dockerfile : docker/web.Dockerfile

    container_name : chat-web

    ports:
      - "5173:5173"


    depends_on:

      - api


    env_file:
      - ./apps/web/.env


    environment:

      - DOCKER=true
      

  mongo:
    
    image: mongo:7
    
    container_name: chat-mongo

    restart: unless-stopped

    
